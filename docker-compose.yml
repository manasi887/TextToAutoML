services:
  backend:
    build:
      context: .
    container_name: text-to-automl-backend
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: 8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173}
      INTENT_MODEL_DIR: ${INTENT_MODEL_DIR:-/app/backend/storage/nlp_models/intent_classifier}
      TARGET_EMBEDDING_MODEL: ${TARGET_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      TARGET_RERANKER_MODEL: ${TARGET_RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      HF_HOME: /root/.cache/huggingface
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./storage:/app/storage
      - ./backend/storage/nlp_models:/app/backend/storage/nlp_models
      - ${HF_CACHE_DIR:-./.cache/huggingface}:/root/.cache/huggingface:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: text-to-automl-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
